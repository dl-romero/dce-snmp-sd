services:
  dce-snmp-sd:
    build: .
    image: dce-snmp-sd:latest
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Mount a host directory here containing module_lookup.json
      # devices.json will be written here automatically
      - "${DATA_DIR:-./data}:/data"
    environment:
      MODULE_LOOKUP_PATH: /data/module_lookup.json
      DATA_FILE: /data/devices.json
      DCE_SERVERS_FILE: /data/dce_servers.json
      REFRESH_INTERVAL_HOURS: "${REFRESH_INTERVAL_HOURS:-6}"
      DCE_SYNC_INTERVAL_HOURS: "${DCE_SYNC_INTERVAL_HOURS:-1}"
      SNMP_TIMEOUT: "${SNMP_TIMEOUT:-3}"
      SNMP_RETRIES: "${SNMP_RETRIES:-1}"
    restart: unless-stopped
    networks:
      - monitoring

  snmp-exporter:
    image: prom/snmp-exporter:latest
    ports:
      - "9116:9116"
    volumes:
      # Mount the directory containing snmp.yml generated by dce-snmp-modules
      - "${SNMP_CONFIG_DIR:-./data}:/etc/snmp_exporter"
    command:
      - "--config.file=/etc/snmp_exporter/snmp.yml"
    restart: unless-stopped
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
